name: Korea Market Alert

on:
  schedule:
    - cron: "*/5 0-6 * * 1-5"
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: /tmp/korea_alert_state.json
          key: alert-state
          restore-keys: alert-state

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=src PYTHONPATH=src pytest tests/ -q
        working-directory: ${{ github.workspace }}

      - name: Run alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/korea_alert_state.json
          key: alert-state-${{ github.run_id }}